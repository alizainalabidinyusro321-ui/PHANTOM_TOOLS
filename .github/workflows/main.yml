
name: PHANTOM_TOOLS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract original project
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name 'PHANTOM_TOOLS_BUILD_READY.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP" -d project

          if [ ! -f project/settings.gradle.kts ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          if [ ! -f project/app/build.gradle.kts ]; then
            echo "ERROR: Android app folder not found"
            exit 1
          fi

      - name: Build PHANTOM_TOOLS
        run: |
          gradle -p project :app:assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: PHANTOM_TOOLS-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
